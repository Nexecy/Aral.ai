# Cloud Run service spec for the Aral.ai FastAPI API.
# Deploy with: python scripts/deploy_cloudrun.py
# (that script builds the image and applies these runtime settings.)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aral-ai-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
        # Instance-based CPU so FastAPI BackgroundTasks (PDF parse after 202) can finish.
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        # Public URL without allUsers IAM (orgs often block that binding).
        run.googleapis.com/invoker-iam-disabled: "true"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 900
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
